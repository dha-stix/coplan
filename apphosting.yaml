# Firebase App Hosting settings — https://firebase.google.com/docs/app-hosting/configure
#
# The Firebase web config is supplied automatically at build time (FIREBASE_WEBAPP_CONFIG,
# mapped to NEXT_PUBLIC_FIREBASE_* in next.config.ts). EmailJS keys live in Cloud Secret
# Manager, not in this public repo — create them once with:
#   firebase apphosting:secrets:set emailjsServiceId
#   firebase apphosting:secrets:set emailjsInviteTemplateId
#   firebase apphosting:secrets:set emailjsPublicKey

runConfig:
  # Scale to zero when idle and cap instances so costs stay inside the free tier.
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://coplan--coplan-aabda.us-central1.hosted.app
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_EMAILJS_SERVICE_ID
    secret: emailjsServiceId
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_EMAILJS_INVITE_TEMPLATE_ID
    secret: emailjsInviteTemplateId
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_EMAILJS_PUBLIC_KEY
    secret: emailjsPublicKey
    availability: [BUILD, RUNTIME]
